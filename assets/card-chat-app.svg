<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" role="img" aria-label="Chat App">
  <title>Chat App</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#13213b"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#1f6feb"/><stop offset="1" stop-color="#a5d6ff"/></linearGradient>
    <linearGradient id="ico" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity=".9"/><stop offset="1" stop-color="#1f6feb" stop-opacity=".9"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="c"><rect x="2" y="2" width="696" height="246" rx="22"/></clipPath>
  </defs>
  <style>
    .run{stroke-dasharray:170 1884;animation:run 5.5s linear infinite}
    @keyframes run{to{stroke-dashoffset:-2054}}
    .ico{animation:bob 3.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .arrow{animation:nudge 1.8s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
  </style>
  <g clip-path="url(#c)">
    <rect width="700" height="250" fill="url(#bg)"/>
    <circle cx="660" cy="-10" r="130" fill="#58a6ff" fill-opacity=".18" filter="url(#glow)"/>
    <circle cx="40" cy="260" r="110" fill="#1f6feb" fill-opacity=".10" filter="url(#glow)"/>
  </g>
  <rect x="2" y="2" width="696" height="246" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="2"/>
  <rect class="run" x="2" y="2" width="696" height="246" rx="22" fill="none" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>

  <g class="ico"><rect x="36" y="34" width="64" height="64" rx="18" fill="url(#ico)"/><text x="68" y="79" text-anchor="middle" font-size="34">💬</text></g>
  <text x="118" y="68" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="29" font-weight="800" fill="#f0f6fc">Chat App</text>
  <text x="118" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#58a6ff">github.com/bassemammar1</text>
  <rect x="535" y="40" width="129" height="30" rx="15" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".75"/>
  <text x="599.5" y="60" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">AI catch-up</text>
  <text x="36" y="132" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17.5" fill="#c9d1d9">One-to-one chat with sent / delivered / read ticks</text><text x="36" y="156" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17.5" fill="#c9d1d9">and presence, plus an AI catch-up that summarizes the</text><text x="36" y="180" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17.5" fill="#c9d1d9">messages you missed in two lines.</text>
  <rect x="36" y="198" width="49" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="60.5" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs">PHP</text><rect x="95" y="198" width="66" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="128.0" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" textLength="42.0" lengthAdjust="spacingAndGlyphs">MySQL</text><rect x="171" y="198" width="108" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="225.0" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" textLength="84.0" lengthAdjust="spacingAndGlyphs">JavaScript</text><rect x="289" y="198" width="74" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="326.0" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" textLength="50.400000000000006" lengthAdjust="spacingAndGlyphs">OpenAI</text>
  <g class="arrow"><text x="664" y="218" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#58a6ff">View repo →</text></g>
</svg>
