<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 56" width="1440" height="56" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".25" stop-color="#58a6ff"/><stop offset=".5" stop-color="#1f6feb"/><stop offset=".75" stop-color="#a5d6ff"/><stop offset="1" stop-color="#a5d6ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .shine{animation:run 4.5s ease-in-out infinite}
    @keyframes run{from{transform:translateX(-420px)}to{transform:translateX(1500px)}}
    .dia{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(45deg) scale(1.35)}}
    .tw{animation:tw 2.8s ease-in-out infinite} .tw2{animation-delay:-1.4s}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  </style>
  <rect x="0" y="26" width="1440" height="4" rx="2" fill="url(#line)" fill-opacity=".55"/>
  <rect class="shine" x="0" y="25" width="420" height="6" rx="3" fill="url(#shine)"/>
  <rect class="dia" x="711.0" y="19" width="18" height="18" rx="3" fill="#1f6feb" stroke="#fff" stroke-opacity=".6"/>
  <text class="tw" x="600.0" y="34" font-size="22" fill="#58a6ff" text-anchor="middle">✦</text>
  <text class="tw tw2" x="840.0" y="34" font-size="22" fill="#a5d6ff" text-anchor="middle">✦</text>
</svg>
