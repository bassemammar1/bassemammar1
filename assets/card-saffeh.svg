<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" role="img" aria-label="Saffeh">
  <title>Saffeh</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#1b1840"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f778ba"/><stop offset=".5" stop-color="#8957e5"/><stop offset="1" stop-color="#39c5cf"/></linearGradient>
    <linearGradient id="ico" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f778ba" stop-opacity=".9"/><stop offset="1" stop-color="#8957e5" stop-opacity=".9"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="c"><rect x="2" y="2" width="696" height="246" rx="22"/></clipPath>
  </defs>
  <style>
    .run{stroke-dasharray:170 1884;animation:run 5.5s linear infinite}
    @keyframes run{to{stroke-dashoffset:-2054}}
    .ico{animation:bob 3.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .arrow{animation:nudge 1.8s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
  </style>
  <g clip-path="url(#c)">
    <rect width="700" height="250" fill="url(#bg)"/>
    <circle cx="660" cy="-10" r="130" fill="#f778ba" fill-opacity=".30" filter="url(#glow)"/>
    <circle cx="40" cy="260" r="110" fill="#8957e5" fill-opacity=".16" filter="url(#glow)"/>
  </g>
  <rect x="2" y="2" width="696" height="246" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="2"/>
  <rect class="run" x="2" y="2" width="696" height="246" rx="22" fill="none" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>

  <g class="ico"><rect x="36" y="34" width="64" height="64" rx="18" fill="url(#ico)"/><text x="68" y="79" text-anchor="middle" font-size="34">🅿️</text></g>
  <text x="118" y="68" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="29" font-weight="800" fill="#f0f6fc">Saffeh</text>
  <text x="118" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#f778ba">Private repo · team project</text>
  <rect x="562" y="40" width="102" height="30" rx="15" fill="#f778ba" fill-opacity=".14" stroke="#f778ba" stroke-opacity=".75"/>
  <text x="613.0" y="60" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#f778ba">Flagship</text>
  <text x="36" y="132" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17.5" fill="#c9d1d9">Parking search and booking platform: drivers find,</text><text x="36" y="156" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17.5" fill="#c9d1d9">reserve and pay for spots online; lot owners list</text><text x="36" y="180" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17.5" fill="#c9d1d9">spaces, set prices and manage bookings.</text>
  <rect x="36" y="198" width="82" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="77.0" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" textLength="58.800000000000004" lengthAdjust="spacingAndGlyphs">Next.js</text><rect x="128" y="198" width="108" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="182.0" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" textLength="84.0" lengthAdjust="spacingAndGlyphs">TypeScript</text><rect x="246" y="198" width="91" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="291.5" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" textLength="67.2" lengthAdjust="spacingAndGlyphs">Firebase</text><rect x="347" y="198" width="49" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="371.5" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs">FCM</text>
  <g class="arrow"><text x="664" y="218" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f778ba">In development</text></g>
</svg>
